
name: CORE Document Processing

on:
  push:
    branches:
      - main
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-document-processing
  cancel-in-progress: false

jobs:
  process-documents:
    name: Process queued documents
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @core/database generate

      - name: Build workspace packages
        run: |
          pnpm --filter @core/shared build
          pnpm --filter @core/database build
          pnpm --filter @core/storage build
          pnpm --filter @core/extraction build
          pnpm --filter @core/chunking build
          pnpm --filter @core/ai build
          pnpm --filter @core/jobs build
          pnpm --filter @core/indexing build

      - name: Build document processing worker
        run: pnpm --filter document-processing-worker build

      - name: Process queued documents
        run: node workers/document-processing/dist/src/worker-once.js
